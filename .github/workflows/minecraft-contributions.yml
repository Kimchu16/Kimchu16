name: Update Minecraft contributions

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate contribution geometry
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: minecraft-settings.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install texture reader
        run: python -m pip install Pillow==11.3.0
      - name: Apply Minecraft textures
        run: python scripts/minecraft_textures.py
      - name: Commit the updated landscape
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/minecraft-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Minecraft contribution landscape'
            git push
          fi
