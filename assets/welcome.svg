<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 650 48'
    style='background-color: #00000000;'
    width='650px' height='48px'>

    <style>
@font-face {
  font-family: 'Press Start 2P';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='6300ms' fill='remove'
                    values='m0,24 h0 ; m0,24 h650 ; m0,24 h650 ; m0,24 h0' keyTimes='0;0.35555555555556;0.91111111111111;1' />
                    </path>
    <text font-family='"Press Start 2P", monospace' fill='#B9DD8D' font-size='14'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hello there!
        </textPath>
    </text>
</svg>
